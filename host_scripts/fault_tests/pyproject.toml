[project]
name = "fault-tests"
version = "0.1.0"
description = "Fault tolerance scenario tooling for the bootloader: bad image generator, update runner, bus load"
readme = "README.md"
authors = [
    { name = "Ryan Wong", email = "wongrt0502@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fmt-tool",
    "ota-client",
]

[project.scripts]
fault-images = "fault_tests.images:main"
fault-flash = "fault_tests.flash:main"
fault-busload = "fault_tests.busload:main"

[tool.uv.sources]
fmt-tool = { path = "../fmt_tool", editable = true }
ota-client = { path = "../ota_client", editable = true }

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"
